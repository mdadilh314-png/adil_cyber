<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adil Digital Kendra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header Section -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-xl text-white shadow-lg">AD</div>
        <div>
          <h1 class="text-lg font-bold leading-tight">Adil Digital Kendra</h1>
          <p class="text-xs text-emerald-400 font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Systems Live
          </p>
        </div>
      </div>
    </div>
  </header>

  <!-- Notice Banner -->
  <div id="notice-banner" class="bg-indigo-900/50 border-b border-indigo-700/50 px-4 py-2 text-xs text-center text-indigo-200 hidden">
    <span id="notice-text">Notice loading...</span>
  </div>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">
    
    <!-- Section 1: Digital Tools Grid -->
    <section>
      <div class="flex items-center space-x-2 mb-4">
        <span class="h-5 w-1 bg-indigo-500 rounded-full"></span>
        <h2 class="text-base font-semibold text-slate-200">Interactive Tools</h2>
      </div>
      
      <!-- Responsive Grid: Mobile 3 Columns | Tablet 4 Columns | Desktop 6 Columns -->
      <div id="tools-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
        <!-- Skeleton Loader -->
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 animate-pulse h-28"></div>
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 animate-pulse h-28"></div>
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 animate-pulse h-28"></div>
      </div>
    </section>

    <!-- Section 2: Important Direct Links -->
    <section>
      <div class="flex items-center space-x-2 mb-4">
        <span class="h-5 w-1 bg-emerald-500 rounded-full"></span>
        <h2 class="text-base font-semibold text-slate-200">Portal Services & Links</h2>
      </div>
      
      <div id="links-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 animate-pulse h-28"></div>
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 animate-pulse h-28"></div>
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 animate-pulse h-28"></div>
      </div>
    </section>

  </main>

  <script>
    // Firebase Config Integrated
    const firebaseConfig = {
      apiKey: "AIzaSyBRXbHx6wUVbkHLbtaY9m2p6lcmEHNyubc",
      authDomain: "adil-digital-kendra.firebaseapp.com",
      databaseURL: "https://adil-digital-kendra-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "adil-digital-kendra",
      storageBucket: "adil-digital-kendra.firebasestorage.app",
      messagingSenderId: "394806804134",
      appId: "1:394806804134:web:91a51971704408df48be67"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Elements
    const toolsGrid = document.getElementById('tools-grid');
    const linksGrid = document.getElementById('links-grid');
    const noticeBanner = document.getElementById('notice-banner');
    const noticeText = document.getElementById('notice-text');

    // Fetch Tools Live
    db.ref('tools').on('value', (snapshot) => {
      toolsGrid.innerHTML = '';
      const data = snapshot.val();
      if (!data) {
        toolsGrid.innerHTML = '<p class="col-span-full text-xs text-slate-400 text-center py-4">Koi tools available nahi hain.</p>';
        return;
      }
      Object.keys(data).forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = "bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-indigo-500 rounded-xl p-3 flex flex-col items-center justify-center text-center transition-all cursor-pointer shadow-sm group hover:-translate-y-0.5";
        card.onclick = () => {
          if (item.target_url) {
            window.open(item.target_url, '_blank');
          } else if (item.code) {
            // Open inline dynamic tool runner
            const win = window.open("", "_blank");
            win.document.write(item.code);
          }
        };
        card.innerHTML = `
          <img src="${item.icon_url || 'https://img.icons8.com/color/96/wrench.png'}" class="w-10 h-10 mb-2 object-contain group-hover:scale-110 transition-transform" />
          <span class="text-xs font-medium text-slate-200 line-clamp-2 leading-tight">${item.title}</span>
        `;
        toolsGrid.appendChild(card);
      });
    });

    // Fetch Links Live
    db.ref('links').on('value', (snapshot) => {
      linksGrid.innerHTML = '';
      const data = snapshot.val();
      if (!data) {
        linksGrid.innerHTML = '<p class="col-span-full text-xs text-slate-400 text-center py-4">Koi links available nahi hain.</p>';
        return;
      }
      Object.keys(data).forEach(key => {
        const item = data[key];
        const card = document.createElement('a');
        card.href = item.target_url || '#';
        card.target = "_blank";
        card.className = "bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-emerald-500 rounded-xl p-3 flex flex-col items-center justify-center text-center transition-all shadow-sm group hover:-translate-y-0.5";
        card.innerHTML = `
          <img src="${item.icon_url || 'https://img.icons8.com/color/96/link.png'}" class="w-10 h-10 mb-2 object-contain group-hover:scale-110 transition-transform" />
          <span class="text-xs font-medium text-slate-200 line-clamp-2 leading-tight">${item.title}</span>
        `;
        linksGrid.appendChild(card);
      });
    });

    // System Notice listener
    db.ref('system/notice_message').on('value', (snapshot) => {
      const msg = snapshot.val();
      if (msg) {
        noticeText.innerText = msg;
        noticeBanner.classList.remove('hidden');
      } else {
        noticeBanner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
