<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adil Digital Kendra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- MAINTENANCE OVERLAY -->
  <div id="maintenance-overlay" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
    <div class="w-20 h-20 rounded-3xl bg-rose-600/20 border border-rose-500/30 flex items-center justify-center mb-4">
      <svg class="w-10 h-10 text-rose-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    <h1 class="text-2xl font-black text-white uppercase tracking-wider mb-2">SERVER UNDER MAINTENANCE</h1>
    <p class="text-xs text-slate-400 max-w-xs">We are currently upgrading systems. Please check back shortly.</p>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-3">
        <div class="w-16 h-16 rounded-2xl bg-indigo-600 mx-auto flex items-center justify-center font-black text-3xl text-white shadow-lg shadow-indigo-500/30">
          AD
        </div>
        <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white uppercase pt-2">ADIL DIGITAL KENDRA</h1>
      </div>

      <form id="operator-login-form" class="space-y-4 pt-2">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Username</label>
          <input type="text" id="username-input" required placeholder="Enter username" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all placeholder:text-slate-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
          <input type="password" id="password-input" required placeholder="Enter password" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all placeholder:text-slate-600" />
        </div>

        <div id="login-error" class="text-xs font-semibold text-rose-500 text-center hidden"></div>

        <button type="submit" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/20">
          Login
        </button>
      </form>

      <div class="pt-6 border-t border-slate-800 text-center space-y-3">
        <p class="text-xs font-medium text-slate-400">To access the portal, contact us:</p>
        <div class="flex items-center justify-center gap-3">
          <a href="https://wa.me/917488176848?text=Hello%20Adil%20Digital%20Kendra,%20I%20need%20portal%20access%20key." target="_blank" class="flex items-center space-x-2 bg-slate-950 hover:bg-slate-800 border border-slate-800 px-4 py-2.5 rounded-xl text-xs font-medium text-slate-200 transition-all">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="w-4 h-4 object-contain" alt="WhatsApp" />
            <span>WhatsApp</span>
          </a>
          <a href="mailto:byteburner356@gmail.com?subject=Portal%20Access%20Request" class="flex items-center space-x-2 bg-slate-950 hover:bg-slate-800 border border-slate-800 px-4 py-2.5 rounded-xl text-xs font-medium text-slate-200 transition-all">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" class="w-4 h-4 object-contain" alt="Gmail" />
            <span>Email</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="main-portal" class="hidden min-h-screen flex flex-col justify-between">
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/30">AD</div>
          <div>
            <h1 class="text-lg sm:text-xl font-black tracking-tight text-white uppercase">ADIL DIGITAL KENDRA</h1>
            <p id="user-display" class="text-xs text-indigo-400 font-medium"></p>
          </div>
        </div>

        <button id="logout-btn" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 text-slate-300 px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all">
          Logout
        </button>
      </div>
    </header>

    <div id="notice-banner" class="bg-indigo-950/80 border-b border-indigo-800/50 px-4 py-2.5 text-xs text-center text-indigo-200 hidden font-medium">
      <span id="notice-text"></span>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-10 w-full flex-grow">
      <section>
        <div class="flex items-center space-x-3 mb-5 border-b border-slate-800 pb-3">
          <span class="h-6 w-1.5 bg-indigo-500 rounded-full"></span>
          <h2 class="text-lg sm:text-xl font-bold text-white tracking-wide">Interactive Tools</h2>
        </div>
        
        <div id="tools-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4"></div>
      </section>

      <section>
        <div class="flex items-center space-x-3 mb-5 border-b border-slate-800 pb-3">
          <span class="h-6 w-1.5 bg-emerald-500 rounded-full"></span>
          <h2 class="text-lg sm:text-xl font-bold text-white tracking-wide">Portal Services & Links</h2>
        </div>
        
        <div id="links-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4"></div>
      </section>
    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
      <p>&copy; 2026 Adil Digital Kendra. All rights reserved.</p>
    </footer>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRXbHx6wUVbkHLbtaY9m2p6lcmEHNyubc",
      authDomain: "adil-digital-kendra.firebaseapp.com",
      databaseURL: "https://adil-digital-kendra-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "adil-digital-kendra",
      storageBucket: "adil-digital-kendra.firebasestorage.app",
      messagingSenderId: "394806804134",
      appId: "1:394806804134:web:91a51971704408df48be67"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const maintenanceOverlay = document.getElementById('maintenance-overlay');
    const loginScreen = document.getElementById('login-screen');
    const mainPortal = document.getElementById('main-portal');
    const loginForm = document.getElementById('operator-login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const userDisplay = document.getElementById('user-display');

    const toolsGrid = document.getElementById('tools-grid');
    const linksGrid = document.getElementById('links-grid');
    const noticeBanner = document.getElementById('notice-banner');
    const noticeText = document.getElementById('notice-text');

    // Live Server Maintenance Listener
    db.ref('system/server_status').on('value', (snap) => {
      if (snap.val() === 'maintenance') {
        maintenanceOverlay.classList.remove('hidden');
      } else {
        maintenanceOverlay.classList.add('hidden');
      }
    });

    function getSessionToken() {
      let token = localStorage.getItem('ad_session_token');
      if (!token) {
        token = 'sess_' + Math.random().toString(36).substring(2) + Date.now();
        localStorage.setItem('ad_session_token', token);
      }
      return token;
    }

    function updateLastSeen(username) {
      const now = new Date().toLocaleString();
      db.ref('users/' + username).update({ last_seen: now });
    }

    const storedUser = localStorage.getItem('ad_user');
    if (storedUser) {
      verifyAndUnlock(storedUser);
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();

      db.ref('users/' + username).once('value', (snapshot) => {
        const userData = snapshot.val();
        if (userData && userData.password === password) {
          if (userData.status === 'blocked') {
            loginError.innerText = "Account Blocked: " + (userData.block_reason || "Violation");
            loginError.classList.remove('hidden');
            return;
          }
          const sessionToken = getSessionToken();
          db.ref('users/' + username + '/active_session').set(sessionToken).then(() => {
            localStorage.setItem('ad_user', username);
            updateLastSeen(username);
            verifyAndUnlock(username);
          });
        } else {
          loginError.innerText = "Invalid Username or Password";
          loginError.classList.remove('hidden');
        }
      });
    });

    function verifyAndUnlock(username) {
      const currentToken = getSessionToken();
      db.ref('users/' + username + '/active_session').on('value', (snapshot) => {
        const activeToken = snapshot.val();
        if (activeToken === currentToken) {
          loginScreen.classList.add('hidden');
          mainPortal.classList.remove('hidden');
          userDisplay.innerText = "User: " + username;
          updateLastSeen(username);
          loadPortalData();
        } else {
          logout();
        }
      });
    }

    logoutBtn.addEventListener('click', logout);

    function logout() {
      const username = localStorage.getItem('ad_user');
      if (username) {
        db.ref('users/' + username + '/active_session').off();
      }
      localStorage.removeItem('ad_user');
      mainPortal.classList.add('hidden');
      loginScreen.classList.remove('hidden');
    }

    function loadPortalData() {
      db.ref('tools').on('value', (snapshot) => {
        toolsGrid.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
          toolsGrid.innerHTML = '<p class="col-span-full text-xs text-slate-500 text-center py-6">No tools available at the moment.</p>';
          return;
        }
        Object.keys(data).forEach(key => {
          const item = data[key];
          if (item.hidden) return;
          const card = document.createElement('div');
          card.className = "bg-slate-900 hover:bg-slate-850 border border-slate-800 hover:border-indigo-500/50 rounded-2xl p-4 flex flex-col items-center justify-center text-center transition-all cursor-pointer shadow-lg group hover:-translate-y-1";
          card.onclick = () => {
            if (item.target_url) {
              window.open(item.target_url, '_blank');
            } else if (item.code) {
              const win = window.open("", "_blank");
              win.document.write(item.code);
            }
          };
          
          const iconText = (item.icon_text || 'TOOL').substring(0, 8);
          card.innerHTML = `
            <div class="w-12 h-12 mb-3 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-black text-xs text-white shadow-md group-hover:scale-105 transition-transform uppercase">
              ${iconText}
            </div>
            <span class="text-xs font-semibold text-slate-200 line-clamp-2 leading-tight">${item.title}</span>
          `;
          toolsGrid.appendChild(card);
        });
      });

      db.ref('links').on('value', (snapshot) => {
        linksGrid.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
          linksGrid.innerHTML = '<p class="col-span-full text-xs text-slate-500 text-center py-6">No links available at the moment.</p>';
          return;
        }
        Object.keys(data).forEach(key => {
          const item = data[key];
          if (item.hidden) return;
          const card = document.createElement('a');
          card.href = item.target_url || '#';
          card.target = "_blank";
          card.className = "bg-slate-900 hover:bg-slate-850 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-4 flex flex-col items-center justify-center text-center transition-all shadow-lg group hover:-translate-y-1";
          
          const iconText = (item.icon_text || 'LINK').substring(0, 8);
          card.innerHTML = `
            <div class="w-12 h-12 mb-3 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center font-black text-xs text-white shadow-md group-hover:scale-105 transition-transform uppercase">
              ${iconText}
            </div>
            <span class="text-xs font-semibold text-slate-200 line-clamp-2 leading-tight">${item.title}</span>
          `;
          linksGrid.appendChild(card);
        });
      });

      db.ref('system/notice_message').on('value', (snapshot) => {
        const msg = snapshot.val();
        if (msg) {
          noticeText.innerText = msg;
          noticeBanner.classList.remove('hidden');
        } else {
          noticeBanner.classList.add('hidden');
        }
      });
    }
  </script>
</body>
</html>
